server:
  port: 8082

spring:
  application:
    name: publisher-change-food-card
  datasource:
    url: jdbc:oracle:thin:@//localhost:1521/xe
    username: acc_app_adapter
    password: root
    driver-class-name: oracle.jdbc.OracleDriver
  kafka:
    bootstrap-servers: localhost:9092
    properties:
      log.retention.ms: 259200000
      log.cleanup.policy: delete

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      retries: 3

    consumer:
      group-id: my-consumer-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: "*"

mybatis:
  type-aliases-package: ru.itone.illya4gurenko.entity
  # config-location: classpath:mybatis-config.xml
  mapper-locations:
    - classpath:/mappers/app-adapter-config-mapper.xml
    - classpath:/mappers/app-adapter-io-msgs-mapper.xml
    - classpath:/mappers/app-adapter-trans-mapper.xml
    - classpath:/mappers/gru-reject-tab-mapper.xml
    - classpath:/mappers/gru-vista-tab-mapper.xml
  configuration:
    map-underscore-to-camel-case: true
    default-enum-type-handler: org.apache.ibatis.type.EnumTypeHandler
    jdbc-type-for-null: 'NULL'

batch:
  size: 100
  timeout:
    seconds: 10
    worker:
      delay: 10000