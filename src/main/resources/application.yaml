server:
  port: 8082

spring:
  application:
    name: publisher-change-food-card
  datasource:
    url: jdbc:oracle:thin:@//localhost:1521/xe
    username: acc_app_adapter
    password: root
    driver-class-name: oracle.jdbc.OracleDriver

mybatis:
  type-aliases-package: ru.itone.illya4gurenko.entity
  # config-location: classpath:mybatis-config.xml
  mapper-locations:
    - classpath:/mappers/app-adapter-config-mapper.xml
    - classpath:/mappers/app-adapter-io-msgs-mapper.xml
    - classpath:/mappers/app-adapter-trans-mapper.xml
    - classpath:/mappers/gru-reject-tab-mapper.xml
    - classpath:/mappers/gru-vista-tab-mapper.xml
  configuration:
    map-underscore-to-camel-case: true
    default-enum-type-handler: org.apache.ibatis.type.EnumTypeHandler
    jdbc-type-for-null: 'NULL'
